# テンプレート由来のコード（tools/）の ruff の設定。チームの pyproject.toml の ruff の設定を引き継がない
# （チームが規則や行の長さを変えても、テンプレートの更新のたびに衝突しないように）。値はテンプレートの pyproject.toml と同じ。
target-version = "py314"
line-length = 100

[format]
docstring-code-format = true

[lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C90", "D", "S", "SIM", "C4", "RUF", "PTH"]
ignore = ["D104", "D107", "D203", "D213", "D400", "D401", "D415", "RUF001", "RUF002", "RUF003"]

[lint.mccabe]
max-complexity = 10

[lint.pydocstyle]
convention = "google"
